    <script>
      (function() {
        try {
          var cached = localStorage.getItem('brand_settings_cache');
          if (!cached) return;
          var settings = JSON.parse(cached);
          if (!settings || !settings.primaryColor) return;
          var hex = settings.primaryColor;
          var clean = hex.replace('#','');
          if (clean.length === 3) clean = clean.split('').map(function(c){return c+c;}).join('');
          var val = parseInt(clean,16);
          var r = ((val>>16)&255)/255, g = ((val>>8)&255)/255, b = (val&255)/255;
          var max = Math.max(r,g,b), min = Math.min(r,g,b), h=0, s=0, l=(max+min)/2;
          if (max !== min) {
            var d = max-min;
            s = l>0.5 ? d/(2-max-min) : d/(max+min);
            if (max===r) h=(g-b)/d+(g<b?6:0);
            else if (max===g) h=(b-r)/d+2;
            else h=(r-g)/d+4;
            h /= 6;
          }
          var hue = Math.round(h*360);
          var sat = Math.round(s*100);
          function hsl(h,s,l){ return h+' '+Math.round(Math.min(100,Math.max(8,s)))+'% '+Math.round(Math.min(98,Math.max(8,l)))+'%'; }
          var primary = hsl(hue,sat,l*100);
          var root = document.documentElement;
          root.style.setProperty('--primary', primary);
          root.style.setProperty('--ring', primary);
          root.style.setProperty('--accent', hsl(hue,sat-8,l*100+12));
          root.style.setProperty('--brand-highlight', hsl(hue,sat+10,l*100+12));
          root.style.setProperty('--secondary', hue+' '+Math.min(sat,30)+'% 93%');
          root.style.setProperty('--secondary-foreground', primary);
          root.style.setProperty('--muted', hue+' '+Math.min(sat,20)+'% 95%');
          root.style.setProperty('--muted-foreground', hue+' '+Math.min(sat,25)+'% 45%');
          root.style.setProperty('--border', hue+' '+Math.min(sat,25)+'% 88%');
          root.style.setProperty('--input', hue+' '+Math.min(sat,25)+'% 88%');
          var dark = hue+' '+Math.min(sat,35)+'% 12%';
          root.style.setProperty('--foreground', dark);
          root.style.setProperty('--card-foreground', dark);
          root.style.setProperty('--popover-foreground', dark);
          root.style.setProperty('--background', '0 0% 100%');
          root.style.setProperty('--card', '0 0% 100%');
          root.style.setProperty('--popover', '0 0% 100%');
        } catch(e) {}
      })();
    </script>

    <div id="root"></div>
